name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The tests open no sockets, so this needs no secrets and no network.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package has only ever been exercised on Windows/3.12 by hand. The matrix is
        # here to find out whether that was luck.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Import from outside the repo root
        # Guards a real failure: an editable install made before litsearch/ existed
        # registered only bibcheck, and everything kept working purely because the tests
        # ran from the repo root with the cwd on sys.path.
        working-directory: ${{ runner.temp }}
        run: python -c "import bibcheck, litsearch; print(bibcheck.__file__); print(litsearch.__file__)"

      - name: Tests
        run: python -m pytest -q

      - name: Console script
        run: bibcheck --help

      - name: Benchmark
        # Fails if the deterministic layers drift from benchmark/baseline.json.
        run: python benchmark/benchmark.py
