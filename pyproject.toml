[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literaturesearch"
version = "0.1.0"
description = "BibTeX validation (bibcheck) and an AI-assisted literature search harness (litsearch)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lukas Splitthoff", email = "lukas.splitthoff@gmail.com" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pre-commit>=3.0"]

[project.urls]
Homepage = "https://github.com/lukassplitthoff/literaturesearch"

[project.scripts]
bibcheck = "bibcheck.main:main"

[tool.setuptools.packages.find]
include = ["bibcheck*", "litsearch*"]

[tool.setuptools.package-data]
bibcheck = ["tests/fixtures/*.bib"]

[tool.pytest.ini_options]
testpaths = ["bibcheck/tests", "litsearch/tests"]
addopts = "-q"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119
